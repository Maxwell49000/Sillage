services:
  ollama:
    image: ollama/ollama:0.32.5
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - sillage-network

  ollama-models:
    image: ollama/ollama:0.32.5
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull ${OLLAMA_CHAT_MODEL:-gemma3:1b} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - sillage-network

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-models:
        condition: service_completed_successfully

volumes:
  ollama-data:
