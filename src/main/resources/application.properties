spring.application.name=chatspringai

# CONFIGURATION DE LA BASE DE DONNEES POSTGRES
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/chatspringai}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.sql.init.mode=always

# PARAMETRE POUR HIBERNATE
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CONFIGURATION DE OLLAMA - Optimisé pour PC lent
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:gemma3:1b}
spring.ai.ollama.chat.options.low-v-r-a-m=true
spring.ai.ollama.chat.options.num-thread=4
# Ultra-déterministe pour éviter hallucinations - pas de créativité du tout
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.top-p=0.1
spring.ai.ollama.chat.options.num-predict=150

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# ========== EMBEDDINGS CONFIGURATION ==========
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.embedding.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# ========== RAG CONFIGURATION ==========
app.rag.top-k=5
app.rag.similarity-threshold=0.75
app.rag.chunk-size=700
app.rag.min-chunk-size-chars=300
app.rag.min-chunk-length-to-embed=5
app.rag.max-num-chunks=10000
app.rag.allow-empty-context=false

# ========== FILE UPLOAD CONFIGURATION ==========
app.file.max-size=52428800
app.file.allowed-types=pdf,docx,doc,txt
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://localhost:3000}

# Limites HTTP alignées sur les règles métier d'upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# Endpoints techniques utilisés par Docker et les plateformes d'hébergement
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Sillage
info.app.description=Assistant documentaire local
